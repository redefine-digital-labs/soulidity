name: Desktop Release

# Scoped to `desktop-v*` tags so Web / backend phase tags (e.g. `v0.3.0-phase2a`)
# do not trigger desktop builds. Release convention:
#   - Desktop: `desktop-vX.Y.Z`  (fires this workflow, produces DMG/EXE + GitHub Release)
#   - Web / backend: any other tag prefix (ignored here)
# This is half of the Web ↔ Desktop isolation guarantee; the other half is the
# `/download` page reading a Vercel Blob manifest (DESKTOP_MANIFEST_URL) so
# desktop releases do not require a Web redeploy.
on:
  push:
    tags: ['desktop-v*']

defaults:
  run:
    working-directory: desktop

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install

      - name: Build & Package (macOS)
        run: pnpm --filter @soulidity/desktop run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            desktop/apps/desktop/release/*.dmg
            desktop/apps/desktop/release/*.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install

      - name: Build & Package (Windows)
        run: pnpm --filter @soulidity/desktop run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            desktop/apps/desktop/release/*.exe

  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (for manifest upload)
        run: npm --prefix web ci --no-audit --no-fund

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | head -20

      - name: Locate packaged macOS dmg
        id: dmg
        run: |
          dmg=$(find dist -maxdepth 2 -type f -name '*.dmg' | head -n1)
          if [ -z "$dmg" ]; then
            echo "No dmg found under dist/" >&2
            exit 1
          fi
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish desktop manifest to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: ./web/node_modules/.bin/tsx web/scripts/upload-desktop-dmg.ts "${{ steps.dmg.outputs.path }}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: false
          generate_release_notes: true
