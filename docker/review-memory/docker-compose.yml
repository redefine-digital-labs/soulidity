services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - review-memory-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mnemo-server:
    build:
      context: .
      dockerfile: mnemo-server.Dockerfile
      args:
        MEM9_REF: main
    environment:
      MNEMO_DSN: postgres://postgres:postgres@postgres:5432/mnemo_control?sslmode=disable
      MNEMO_DB_BACKEND: postgres
      MNEMO_PORT: "8080"
      MNEMO_INGEST_MODE: raw
      MNEMO_TIDB_ZERO_ENABLED: "false"
      MNEMO_ENCRYPT_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/v1alpha2/mem9s/memories?limit=1' --header='X-API-Key: 5b4c66f9-3b61-4be7-bc3d-9e346f5b2ac0' --header='X-Mnemo-Agent-Id: review-memory-healthcheck' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  review-memory-pgdata:
